name: pipeline

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: npm ci
      # Pruebas automáticas: la lógica sigue funcionando
      - run: npm test
      # SCA: vulnerabilidades conocidas en las librerías
      - run: npm audit --audit-level=high
      # SAST: patrones peligrosos en el código fuente
      - run: pip install semgrep
      - run: semgrep scan --config auto --error
      # Detección de secretos en el código y el historial
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
